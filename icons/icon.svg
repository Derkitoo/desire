<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b5134" />
      <stop offset="50%" stop-color="#7a3d24" />
      <stop offset="100%" stop-color="#3d2015" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3" />
      <stop offset="50%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#b07d4b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded rectangle for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Subtle inner border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.35" />
  
  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.4" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6" />

  <!-- Compass Star points -->
  <polygon points="256,65 264,120 256,110 248,120" fill="url(#gold)" />
  <polygon points="256,447 264,392 256,402 248,392" fill="url(#gold)" />
  <polygon points="65,256 120,248 110,256 120,264" fill="url(#gold)" />
  <polygon points="447,256 392,248 402,256 392,264" fill="url(#gold)" />

  <!-- Glowing Sacred Heart Emblem -->
  <g filter="url(#glow)">
    <path d="M256 380 C180 300 130 245 130 185 C130 135 170 100 220 100 C242 100 252 112 256 120 C260 112 270 100 292 100 C342 100 382 135 382 185 C382 245 332 300 256 380 Z" 
          fill="url(#gold)" />
  </g>
  
  <!-- Inner heart light detail -->
  <path d="M256 340 C200 280 160 235 160 190 C160 155 185 130 220 130 C238 130 248 140 256 150 C264 140 274 130 292 130 C327 130 352 155 352 190 C352 235 312 280 256 340 Z" 
        fill="#ffffff" opacity="0.25" />

  <!-- Center Sparkle -->
  <circle cx="256" cy="220" r="12" fill="#ffffff" filter="url(#glow)" />
</svg>
